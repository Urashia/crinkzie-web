<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../supabase-config.js" defer></script>
    <script src="Customers.js" defer></script>

    <link rel="stylesheet" href="../Common.css">
    <link rel="stylesheet" href="Customers.css">
</head>
<body>
    <header>
        <div class="logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        <nav>
            <ul>
                <li><a href="../Admin/Dashboard.html">Dashboard</a></li>
                <li><a href="../Admin/Products.html">Products</a></li>
                <li><a href="../Admin/Orders.html">Orders</a></li>
                <li><a href="../Admin/Customer.html">Customers</a></li>
            </ul>
        </nav>
        <a href="#logout" aria-label="Log out" class="logout-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </header>

    <main>
        <section class="customers-view" id="customers-view">
            <div class="customers-header">
                <h1>Customers</h1>

                <div class="search-bar">
                    <span class="search-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="search" id="customer-search" placeholder="Search by name or Student ID" aria-label="Search customers by name or Student ID">
                </div>
            </div>

            <div class="customers-table-wrapper">
                <table class="customers-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Year and Section</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customers-table-body"></tbody>
                </table>
            </div>

            <div class="pagination" id="customers-pagination"></div>
        </section>

        <!-- CUSTOMER DETAIL MODAL (opened by the table's view button) -->
        <div class="customer-detail-overlay" id="customer-detail-view">
            <div class="customer-detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-name">
                <button type="button" id="detail-close-btn" class="detail-close-btn" aria-label="Close">×</button>

                <div class="customer-detail-header">
                    <div class="customer-avatar">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div>
                        <h2 id="detail-name"></h2>
                        <p id="detail-student-id" class="detail-subtext"></p>
                    </div>
                </div>

                <div class="detail-grid">
                    <div class="detail-field">
                        <label>Email</label>
                        <p id="detail-email"></p>
                    </div>
                    <div class="detail-field">
                        <label>Phone</label>
                        <p id="detail-phone"></p>
                    </div>
                    <div class="detail-field">
                        <label>Year and Section</label>
                        <p id="detail-year-section"></p>
                    </div>
                    <div class="detail-field">
                        <label>Campus</label>
                        <p id="detail-campus"></p>
                    </div>
                </div>

                <div class="detail-field wide">
                    <label>Address</label>
                    <p id="detail-address"></p>
                </div>

                <div class="order-history">
                    <label>Order History</label>
                    <ul id="order-history-list"></ul>
                </div>

                <button type="button" id="deactivate-btn" class="deactivate-btn">Deactivate Account</button>
            </div>
        </div>
    </main>

    <footer>
    <div class="footer-container">
        <div class="footer-brand">
            <div class="footer-logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        </div>
        <nav class="footer-nav">
            <ul>
                <li><a href="../Admin/Dashboard.html">Dashboard</a></li>
                <li><a href="../Admin/Products.html">Products</a></li>
                <li><a href="../Admin/Orders.html">Orders</a></li>
                <li><a href="../Admin/Customer.html">Customers</a></li>
            </ul>
        </nav>
    </div>
    <p class="footer-disclaimer">School Purposes Only - 2026</p>
    </footer>
</body>
</html>
