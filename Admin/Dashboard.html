<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../supabase-config.js" defer></script>
    <script src="Dashboard.js" defer></script>

    <link rel="stylesheet" href="../Common.css">
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>
    <header>
        <div class="logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        <nav>
            <ul>
                <li><a href="../Admin/Dashboard.html">Dashboard</a></li>
                <li><a href="../Admin/Products.html">Products</a></li>
                <li><a href="../Admin/Orders.html">Orders</a></li>
                <li><a href="../Admin/Customer.html">Customers</a></li>
            </ul>
        </nav>
        <a href="#logout" aria-label="Log out" class="logout-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </header>

    <main>
        <section class="dashboard-view" id="dashboard-view">
            <h1>Dashboard</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Orders This Week</span>
                    <span class="stat-value" id="stat-orders">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Revenue This Week</span>
                    <span class="stat-value" id="stat-revenue">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Products</span>
                    <span class="stat-value" id="stat-products">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Customers</span>
                    <span class="stat-value" id="stat-customers">—</span>
                </div>
            </div>

            <div class="dashboard-panels">
                <div class="panel panel-orders">
                    <h2>Recent Orders</h2>
                    <div class="panel-table-wrapper">
                        <table class="dashboard-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders-body"></tbody>
                        </table>
                    </div>
                </div>

                <div class="panel panel-stocks">
                    <h2>Stocks</h2>
                    <div class="panel-table-wrapper">
                        <table class="dashboard-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Quantity</th>
                                </tr>
                            </thead>
                            <tbody id="stocks-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
    <div class="footer-container">
        <div class="footer-brand">
            <div class="footer-logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        </div>
        <nav class="footer-nav">
            <ul>
                <li><a href="../Admin/Dashboard.html">Dashboard</a></li>
                <li><a href="../Admin/Products.html">Products</a></li>
                <li><a href="../Admin/Orders.html">Orders</a></li>
                <li><a href="../Admin/Customer.html">Customers</a></li>
            </ul>
        </nav>
    </div>
    <p class="footer-disclaimer">School Purposes Only - 2026</p>
    </footer>
</body>
</html>
