<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../supabase-config.js" defer></script>
    <script src="Products.js" defer></script>

    <link rel="stylesheet" href="../Common.css">
    <link rel="stylesheet" href="Products.css">
</head>
<body>
    <header>
        <div class="logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        <nav>
            <ul>
                <li><a href="../Admin/Dashboard.html">Dashboard</a></li>
                <li><a href="../Admin/Products.html">Products</a></li>
                <li><a href="../Admin/Orders.html">Orders</a></li>
                <li><a href="../Admin/Customer.html">Customers</a></li>
            </ul>
        </nav>
        <a href="#logout" aria-label="Log out" class="logout-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </header>

    <main>
        <section class="products-view" id="products-view">
            <div class="products-header">
                <h1>Products</h1>
                <button id="add-product-btn" class="add-product-btn">ADD PRODUCT</button>
            </div>

            <div class="products-table-wrapper">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- PRODUCT FORM MODAL -->
        <div class="product-form-overlay" id="product-form-overlay">
            <div class="product-form-card" role="dialog" aria-modal="true" aria-labelledby="form-title">
                <button type="button" id="form-close-btn" class="form-close-btn" aria-label="Close">×</button>

                <form id="product-form" class="product-form">
                    <input type="hidden" id="product-id">

                    <div class="form-top-row">
                        <div class="photo-preview" id="photo-preview">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <path d="M21 15l-5-5L5 21"></path>
                            </svg>
                        </div>

                        <div class="photo-upload">
                            <label>Product Photo</label>
                            <div class="file-input-wrapper">
                                <label for="product-photo" class="file-choose-btn">Choose File</label>
                                <span id="file-chosen-label">No File Chosen</span>
                                <input type="file" id="product-photo" accept="image/*" hidden>
                            </div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-field wide">
                            <label for="product-name">Product Name</label>
                            <input type="text" id="product-name" required>
                        </div>
                        <div class="form-field">
                            <label for="product-price">Price</label>
                            <input type="number" id="product-price" required>
                        </div>
                        <div class="form-field">
                            <label for="product-stock">Stocks</label>
                            <input type="number" id="product-stock" required>
                        </div>
                    </div>

                    <div class="form-field wide">
                        <label for="product-description">Description</label>
                        <textarea id="product-description" rows="4" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="save-btn">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
    <div class="footer-container">
        <div class="footer-brand">
            <div class="footer-logo"><img src="../Landing/OreoBitesLogo.jpg" alt="OreoBites logo"></div>
        </div>
        <nav class="footer-nav">
            <ul>
                <li><a href="../Admin/Dashboard.html">Dashboard</a></li>
                <li><a href="../Admin/Products.html">Products</a></li>
                <li><a href="../Admin/Orders.html">Orders</a></li>
                <li><a href="../Admin/Customer.html">Customers</a></li>
            </ul>
        </nav>
    </div>
    <p class="footer-disclaimer">School Purposes Only - 2026</p>
    </footer>
</body>
</html>
